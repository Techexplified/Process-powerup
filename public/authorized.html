<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting Process Power-Up to Trello…</title>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1215;
        --card-bg: #1d2125;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f7f8f9;
        --text-muted: #9fadbc;
        --blue: #579dff;
        --violet: #8546ff;
        --green: #4bce97;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 20px;
        background: var(--bg);
        background-image: 
          radial-gradient(circle at 50% 30%, rgba(133, 70, 255, 0.12) 0%, transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(87, 157, 255, 0.1) 0%, transparent 50%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 90vh;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 36px 28px;
        max-width: 380px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
      }

      .logo-icon {
        width: 52px;
        height: 52px;
        margin-bottom: 20px;
      }

      .spinner-wrapper {
        position: relative;
        width: 48px;
        height: 48px;
        margin-bottom: 20px;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(133, 70, 255, 0.18);
        border-top-color: var(--violet);
        border-right-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.85s cubic-bezier(0.6, 0.2, 0.4, 0.9) infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .title {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 8px;
        letter-spacing: -0.2px;
        color: #f7f8f9;
      }

      .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.5;
        max-width: 300px;
      }

      .status-pill {
        margin-top: 18px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: #22272b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 11px;
        color: #9fadbc;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        animation: pulse 1.4s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="./icons/icon.svg" alt="Process Power-Up" class="logo-icon" />
      <div class="spinner-wrapper" id="spinner-container">
        <div class="spinner" id="spinner"></div>
      </div>
      <h2 class="title" id="status-title">Connecting Process Power-Up…</h2>
      <p class="subtitle" id="status-desc">Finalizing your secure Trello OAuth credentials.</p>
      <div class="status-pill" id="status-pill">
        <span class="dot"></span>
        <span>Secure Handshake</span>
      </div>
    </div>
    <script src="./authorized.js"></script>
  </body>
</html>
