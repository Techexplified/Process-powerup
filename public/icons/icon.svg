<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient Matching the Blue Power-Up Badge in Screenshot -->
    <linearGradient id="proc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#proc-bg)"/>

  <!-- Connected Process Steps Icon (Matching the top-left Processes badge) -->
  <g fill="none" stroke="#60a5fa" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Process Step Node Box -->
    <rect x="22" y="22" width="34" height="26" rx="7" fill="#1e40af" stroke="#93c5fd" stroke-width="5.5"/>
    
    <!-- Step 1 content mini indicator line -->
    <line x1="30" y1="35" x2="48" y2="35" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Connecting Step Flow Link -->
    <path d="M 44 48 L 44 62 L 56 62" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom-Right Process Step Node Box -->
    <rect x="44" y="52" width="34" height="26" rx="7" fill="#1e40af" stroke="#93c5fd" stroke-width="5.5"/>

    <!-- Step 2 content mini indicator line / check -->
    <polyline points="53,65 57,69 67,59" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
